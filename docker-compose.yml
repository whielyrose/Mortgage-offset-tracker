services:

  frontend:
    image: ghcr.io/whielyrose/mortgage-tracker-frontend:latest
    container_name: mortgage-tracker-frontend
    restart: unless-stopped
    ports:
      - "8765:80"
    depends_on:
      - api
      - actual-sync

  api:
    image: ghcr.io/whielyrose/mortgage-tracker-api:latest
    container_name: mortgage-tracker-api
    restart: unless-stopped
    volumes:
      - mortgage_data:/data

  actual-sync:
    image: ghcr.io/whielyrose/mortgage-tracker-actual-sync:latest
    container_name: mortgage-tracker-actual-sync
    restart: unless-stopped                 # always-on service: button + nightly schedule
    env_file: /opt/mortgage-tracker/.env    # see env setup below
    environment:
      SYNC_PORT: "8090"
      SYNC_NIGHTLY_TIME: "23:50"            # local-TZ HH:MM nightly run ("" to disable)
      # RUN_ON_START: "true"               # uncomment to sync once when the container starts
    volumes:
      - actual_sync_cache:/tmp/actual-cache

volumes:
  mortgage_data:
  actual_sync_cache:
